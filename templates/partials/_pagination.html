{% load ui %}
{% if page_obj.paginator.num_pages > 1 %}
<div class="flex items-center justify-between mt-4 text-sm">
  <div class="text-muted">
    共 {{ page_obj.paginator.count }} 条 · 第 {{ page_obj.number }} / {{ page_obj.paginator.num_pages }} 页
  </div>
  <div class="flex gap-2">
    {% if page_obj.has_previous %}
      <a class="btn btn-sm" href="{% qs_replace page=page_obj.previous_page_number %}">上一页</a>
    {% else %}
      <span class="btn btn-sm disabled">上一页</span>
    {% endif %}
    {% if page_obj.has_next %}
      <a class="btn btn-sm" href="{% qs_replace page=page_obj.next_page_number %}">下一页</a>
    {% else %}
      <span class="btn btn-sm disabled">下一页</span>
    {% endif %}
  </div>
</div>
{% endif %}
