{% extends "base.html" %}
{% block title %}密码已修改 · {{ site_name }}{% endblock %}
{% block page_title %}密码已修改{% endblock %}
{% block page_actions %}
  <a class="btn" href="{% url 'accounts:profile' %}">返回我的账号</a>
{% endblock %}

{% block content %}
<div class="card content-narrow">
  <div class="card-body">
    <div class="alert alert-success">密码修改成功，请使用新密码登录其他设备。</div>
    <p class="text-muted mt-3">如需继续处理工单，可直接返回收件箱。</p>
  </div>
  <div class="card-footer flex gap-2">
    <a class="btn btn-primary" href="{% url 'tickets:inbox' %}">返回收件箱</a>
    <a class="btn" href="{% url 'accounts:profile' %}">我的账号</a>
  </div>
</div>
{% endblock %}
