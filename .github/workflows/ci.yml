name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production-0123456789
  FERNET_KEY: F9Li98xxl1T17SjxC4--SWaSr3YMaG_zcu03OFmYVCE=
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver

jobs:
  # 1) 单元测试：SQLite（开发文档 §10.2），离线快速
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Django 自检
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: 安全配置自检
        run: python manage.py check --deploy
      - name: 运行测试
        run: python -m pytest -q --cov=apps --cov-report=term-missing

  # 2) 集成测试：真实 MariaDB，验证 utf8mb4 / 索引长度 / JSON 字段
  mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ticket_system_test
          MARIADB_USER: ticket
          MARIADB_PASSWORD: ticket
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_ENGINE: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: ticket_system_test
      DB_USER: ticket
      DB_PASSWORD: ticket
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: 迁移与测试（MariaDB）
        run: |
          python manage.py migrate
          python -m pytest -q
