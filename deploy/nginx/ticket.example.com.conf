# ===========================================================================
# 新技元邮箱及工单管理系统 · Nginx 站点配置（开发文档 §9.2）
#
# 部署位置（Debian / Ubuntu）：
#   sudo cp deploy/nginx/ticket.example.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/ticket.example.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前置条件：
#   1) 应用已由 docker compose 启动，且宿主机 127.0.0.1:8000 可访问：
#        curl -fsS http://127.0.0.1:8000/healthz
#   2) 静态/媒体目录已挂载到宿主机（见 docker-compose.yml 的 HOST_STATIC_DIR / HOST_MEDIA_DIR）：
#        /srv/ticket-system/staticfiles    ← collectstatic 产物
#        /srv/ticket-system/media          ← 附件与富文本内嵌图片
#      Nginx worker（通常 www-data）需要能读到它们：
#        sudo chmod o+rx /srv/ticket-system /srv/ticket-system/staticfiles /srv/ticket-system/media
#   3) 证书由 certbot 签发到 /etc/letsencrypt/live/ticket.example.com/
#
# 把 ticket.example.com 全部替换为真实域名后生效（本文件是示例，直接复制会被 nginx -t 通过，
# 但证书路径/域名不匹配会导致 HTTPS 起不来）。
# ===========================================================================

# 应用上游：keepalive 复用长连接，省掉每个请求与 Gunicorn 重新握手
upstream oridesk_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# gzip：站点流量大头是静态资源与邮件正文 HTML。
# 只列文本类型——图片/压缩包/woff2 本身已压缩，再 gzip 纯属浪费 CPU。
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xhtml+xml
    image/svg+xml;

# ======================================================= HTTP：全量跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ticket.example.com;

    # certbot 续期的 http-01 校验目录必须放在 301 之前放行，否则校验请求会被跳转掉，
    # 证书到期前自动续期失败（90 天后站点直接不可用）。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =========================================================== HTTPS：主站
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2：nginx >= 1.25.1 时在下方单独加一行 `http2 on;`；
    # 更早版本改为 `listen 443 ssl http2;`（旧写法在新版会有 deprecation 警告，不影响功能）。
    server_name ticket.example.com;

    # ------------------------------------------------------------ TLS 证书
    ssl_certificate         /etc/letsencrypt/live/ticket.example.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/ticket.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/ticket.example.com/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    # OCSP stapling（可选，需要主机能出网解析/访问 CA）：
    #   ssl_stapling on;
    #   ssl_stapling_verify on;
    #   resolver 223.5.5.5 valid=300s;   # 按实际 DNS 调整

    charset utf-8;
    server_tokens off;          # 不对外暴露 nginx 版本号

    # 附件上传上限 30M：略高于应用侧 max_attachment_size_mb=25（默认值，见开发文档 §4.6），
    # 给 MIME/base64 编码膨胀与 multipart 边界留余量。
    # 调大应用侧上限时，这里必须同步调大，否则 Nginx 会先返回 413。
    client_max_body_size 30M;
    client_body_timeout 60s;
    keepalive_timeout 65s;

    access_log /var/log/nginx/ticket.example.com.access.log;
    error_log  /var/log/nginx/ticket.example.com.error.log warn;

    # 安全响应头说明：
    #   Django SecurityMiddleware 已在 config/settings.py（DEBUG=False）输出
    #   HSTS / X-Content-Type-Options / Referrer-Policy / X-Frame-Options。
    #   为代理响应重复添加会产生同名重复头，因此这里只在"不经过 Django"的
    #   /static/ 与 /media/ 两个 location 内补齐必要头。

    # ------------------------------------------------------------ 静态文件
    # collectstatic 产物由 Nginx 直接服务，完全不经过 Gunicorn。
    # 静态文件名带哈希或版本变化，可放心长缓存。
    location ^~ /static/ {
        alias /srv/ticket-system/staticfiles/;
        access_log off;
        autoindex off;
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ------------------------------------------------------- 媒体 / 附件
    # 附件默认只走"应用层鉴权 + X-Accel-Redirect"（方案 A，已默认启用）：
    #   - apps/tickets/views.py::attachment_download / attachment_preview 先校验登录与工单可见性，
    #     通过后返回响应头 `X-Accel-Redirect: /media/attachments/<相对路径>`；
    #   - 本文件的 /media/attachments/ location 设为 internal，只有来自 Django 的内部重定向
    #     才能命中，任何匿名直链一律 404；
    #   - 因此必须同时设置环境变量（.env）：ATTACHMENT_X_ACCEL_PREFIX=/media/attachments/
    # 若该环境变量留空，Django 会自己流式返回文件（本地开发/单机部署可用，但会占用 web 进程）。
    #
    # 其余 /media/ 仍由 Nginx 直出，仅用于富文本内嵌图片等非敏感内容；
    # 请勿把附件放到 attachments/ 之外。
    location ^~ /media/attachments/ {
        internal;
        alias /srv/ticket-system/media/attachments/;
        autoindex off;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
        # 危险扩展名（.exe/.bat/.js 等，见 apps/tickets/models.py::DANGEROUS_EXTENSIONS）
        # 由应用层标记为"仅可下载"并拒绝预览；Nginx 侧不做扩展名拦截。
    }

    # 其余 media（富文本内嵌图片等）。若其中也存在敏感文件，请并入上面的鉴权方案。
    location ^~ /media/ {
        alias /srv/ticket-system/media/;
        autoindex off;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ------------------------------------------------------------ 健康检查
    # 宿主机监控/负载均衡高频探测用。返回 200=正常、503=数据库不可达
    # （apps/core/views.py::healthz）。探测频率高，关闭访问日志避免刷屏。
    location = /healthz {
        access_log off;
        proxy_pass http://oridesk_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
    }

    # ------------------------------------------------------------ 应用主入口
    location / {
        proxy_pass http://oridesk_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";   # 配合 upstream keepalive，复用后端长连接

        # 全套转发头。缺一不可的原因：
        #   - X-Forwarded-Proto：settings.py 的 SECURE_PROXY_SSL_HEADER 依赖它，
        #     缺失会让 Django 以为请求是 http，触发 SECURE_SSL_REDIRECT 无限重定向；
        #   - Host / X-Forwarded-Host：settings.py 打开了 USE_X_FORWARDED_HOST，
        #     且 ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS 按域名校验，缺失会 400/403；
        #   - X-Real-IP / X-Forwarded-For：审计日志与登录风控需要真实客户端 IP。
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   $server_port;
        proxy_set_header X-Forwarded-Server $host;

        proxy_redirect off;

        # 超时须与 Gunicorn 对齐：默认 gunicorn --timeout 30s，
        # Nginx 读超时必须略大于它，否则会先抛 504 把真实错误（500/超时栈）掩盖掉。
        # 若日后给 gunicorn 增加 --timeout 120，这里同步改为 125s。
        proxy_connect_timeout 10s;
        proxy_send_timeout    65s;
        proxy_read_timeout    65s;

        # 富文本/附件上传走 Django，请求体先缓冲再转发，避免慢客户端占用后端连接
        proxy_request_buffering on;
        proxy_buffering on;
    }

    # 阻止对隐藏文件（.env、.git 等）的探测；放行 ACME 校验目录
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
    }
}
